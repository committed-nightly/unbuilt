name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The Docker-backed tests skip themselves without a daemon, so assert
      # one is here rather than let a run that tested the interesting half of
      # the suite report green.
      - name: a Docker daemon is reachable
        run: docker info --format 'server {{.ServerVersion}}'

      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  dogfood:
    # The README quotes this run. If the example or the tool changes, this is
    # the job that notices before a reader does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .

      - name: the example reports what the README says it reports
        run: |
          set -euo pipefail
          unbuilt examples/Dockerfile > out.txt && status=0 || status=$?
          cat out.txt
          test "$status" -eq 1
          grep -qF 'Not built for this target: build, test.' out.txt
          grep -qF '4 instructions with no effect on this build.' out.txt
          for kind in unused-arg empty-expansion superseded \
                      copy-from-unknown orphan-stage; do
            grep -qF "$kind" out.txt
          done

      # The README's --context section. The example ships a .dockerignore
      # whose `*lock*` line also catches package-lock.json, so the deps
      # stage copies by name a file the builder is never sent.
      - name: --context finds the dockerignored COPY the README quotes
        run: |
          set -euo pipefail
          unbuilt examples/Dockerfile --context examples >ctx.txt && s=0 || s=$?
          cat ctx.txt
          test "$s" -eq 1
          grep -qF '5 instructions with no effect on this build.' ctx.txt
          grep -qF 'dockerignored-copy' ctx.txt
          grep -qF '.dockerignore line 10 (*lock*)' ctx.txt

          # Without --context the checks are off, and the count the rest of
          # the README quotes is the one that must not move.
          unbuilt examples/Dockerfile >plain.txt && s=0 || s=$?
          test "$s" -eq 1
          grep -qF '4 instructions with no effect on this build.' plain.txt
          if grep -qF 'dockerignored-copy' plain.txt; then
            echo 'the context check ran without --context' >&2
            exit 1
          fi

      # The whole point of --context is that it must not fire on a correct
      # build. `COPY . /app` beside an ignore file is the commonest pair of
      # lines in the ecosystem and has to stay silent.
      - name: a correct COPY beside a .dockerignore stays silent
        run: |
          set -euo pipefail
          mkdir -p ctx/src ctx/node_modules
          printf 'x\n' > ctx/src/app.js
          printf 'x\n' > ctx/node_modules/junk.js
          printf 'node_modules\n*.md\n' > ctx/.dockerignore
          printf 'FROM alpine AS app\nCOPY . /app\nCOPY src/*.js /app/\nRUN go\n' \
            > ctx/Dockerfile
          unbuilt ctx/Dockerfile --context ctx | tee quiet.txt
          grep -qF 'Every instruction has an effect on this build.' quiet.txt

      - name: a .dockerignore docker rejects exits 2 and still reports the file
        run: |
          set -euo pipefail
          printf 'f[.txt\n' > ctx/.dockerignore
          unbuilt ctx/Dockerfile --context ctx >out.txt 2>err.txt && s=0 || s=$?
          test "$s" -eq 2
          grep -qF 'unterminated [' err.txt
          grep -qF 'Every instruction has an effect on this build.' out.txt
          if grep -qF 'unbuilt: ' out.txt; then
            echo 'the diagnostic reached stdout' >&2
            exit 1
          fi

      # logbook#47, asserted on the CLI rather than only in the suite: a real
      # directory named .git, excluded the way near every repository excludes
      # it. This was silent and exited 0 until the suffix guard was fixed, so
      # it is the regression worth catching from outside the tests.
      - name: a dockerignored COPY .git is reported, not silenced
        run: |
          set -euo pipefail
          mkdir -p repro/.git
          printf 'ref: refs/heads/main\n' > repro/.git/HEAD
          printf '.git\n' > repro/.dockerignore
          printf 'FROM alpine AS app\nCOPY .git /app/\nRUN use-it\n' \
            > repro/Dockerfile
          unbuilt repro/Dockerfile --context repro >git.txt && s=0 || s=$?
          cat git.txt
          test "$s" -eq 1
          grep -qF 'dockerignored-copy' git.txt
          grep -qF '.dockerignore line 1 (.git)' git.txt

          # ...and the same directory with no rule against it stays silent.
          rm repro/.dockerignore
          unbuilt repro/Dockerfile --context repro | tee nogit.txt
          grep -qF 'Every instruction has an effect on this build.' nogit.txt

      # `COPY` cannot fetch. The quoted refusal is checked against the real
      # builder in tests/test_against_docker.py; this checks a reader gets it
      # from the CLI, and that the `ADD` that does work is left alone.
      - name: a COPY of a git ref is reported and the ADD beside it is not
        run: |
          set -euo pipefail
          url='https://github.com/moby/buildkit.git#v0.10.1'
          printf 'FROM alpine AS app\nCOPY %s /b\nRUN use-it\n' "$url" \
            > copyurl.Dockerfile
          unbuilt copyurl.Dockerfile >url.txt && s=0 || s=$?
          cat url.txt
          test "$s" -eq 1
          grep -qF 'copy-remote-source' url.txt

          # The quoted refusal is asserted on -q, whose line is one finding
          # and is not wrapped. The default output wraps at 78 columns and
          # breaks the phrase in half, which is a true thing about the
          # report and a false reason for this step to go red.
          unbuilt -q copyurl.Dockerfile >quiet.txt && s=0 || s=$?
          test "$s" -eq 1
          grep -qF "source can't be a git ref for COPY" quiet.txt

          printf 'FROM alpine AS app\nADD %s /b\nRUN use-it\n' "$url" \
            > addurl.Dockerfile
          unbuilt addurl.Dockerfile | tee add.txt
          grep -qF 'Every instruction has an effect on this build.' add.txt

      - name: a clean Dockerfile exits 0 and says so
        run: |
          set -euo pipefail
          printf 'FROM alpine AS app\nENV A=1\nRUN use-it\n' > clean.Dockerfile
          unbuilt clean.Dockerfile | tee clean.txt
          grep -qF 'Every instruction has an effect on this build.' clean.txt

      # The README's "When --target names no stage" section, asserted on the
      # channel it is about: a typo must not be able to reach stdout-only
      # consumers as silence and a zero exit.
      - name: a --target that names no stage exits 2 and says so on stderr
        run: |
          set -euo pipefail
          run_typo() {  # "$@" = extra flags; sets $status, writes out/err.txt
            unbuilt examples/Dockerfile --target buidler "$@" \
              >out.txt 2>err.txt && status=0 || status=$?
          }

          # Every mode: exit 2, and the diagnostic is on stderr.
          for mode in default quiet json; do
            case $mode in
              default) run_typo ;;
              quiet)   run_typo -q ;;
              json)    run_typo --json ;;
            esac
            test "$status" -eq 2
            grep -qF 'no stage named buidler' err.txt
          done

          # ...and it is *not* on stdout in the two modes whose stdout is for
          # something else. --json is excluded on purpose: a consumer of that
          # mode reads `errors` out of the document, so there it belongs.
          # `! grep -q ...` would be the obvious spelling and it never fails:
          # set -e is documented to ignore a pipeline whose return value is
          # inverted with `!`, so the assertion passes whatever grep finds.
          no_diagnostic_on_stdout() {
            if grep -qF 'unbuilt: ' out.txt; then
              echo "diagnostic reached stdout:" >&2
              cat out.txt >&2
              exit 1
            fi
          }

          run_typo
          no_diagnostic_on_stdout
          run_typo -q
          no_diagnostic_on_stdout
          test "$(wc -l <out.txt)" -eq 4   # findings only, so wc -l still means it

          run_typo --json
          python3 -c "
          import json
          d = json.load(open('out.txt'))
          assert d['errors'] == ['no stage named buidler; analysed the last stage (runtime) instead'], d['errors']
          assert len(d['findings']) == 4, d['findings']
          print('json carries the error and stays parseable')
          "

      - name: a file with no FROM exits 2 and claims nothing
        run: |
          set -euo pipefail
          printf 'RUN true\n' > noform.Dockerfile
          unbuilt noform.Dockerfile >out.txt 2>err.txt && status=0 || status=$?
          test "$status" -eq 2
          test ! -s out.txt
          grep -qF 'builds nothing' err.txt

      - name: --json is valid JSON with findings and notes apart
        run: |
          set -euo pipefail
          unbuilt --json examples/Dockerfile > out.json || true
          python3 -c "
          import json, sys
          d = json.load(open('out.json'))
          assert len(d['findings']) == 4, d['findings']
          assert [n['kind'] for n in d['notes']] == ['orphan-stage'], d['notes']
          assert d['target'] == 'runtime' and d['not_built'] == ['build', 'test']
          print('json ok')
          "
